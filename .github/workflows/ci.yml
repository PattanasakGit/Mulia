name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mulia
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: mulia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mulia" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://mulia@127.0.0.1:5432/mulia_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - name: Build
        run: npm run build
        env:
          # Intentionally unreachable: the build must not touch the DB.
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/ci
